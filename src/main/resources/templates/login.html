<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>경제 지표 앱 - 로그인</title>
    <script src="https://cdn.tailwindcss.com/3.4.16"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/remixicon/4.6.0/remixicon.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        primary: '#2563eb',
                        secondary: '#f1f5f9'
                    },
                    borderRadius: {
                        'none': '0px',
                        'sm': '4px',
                        DEFAULT: '8px',
                        'md': '12px',
                        'lg': '16px',
                        'xl': '20px',
                        '2xl': '24px',
                        '3xl': '32px',
                        'full': '9999px',
                        'button': '8px'
                    }
                }
            }
        }
    </script>
    <style>
        :where([class^="ri-"])::before {
            content: "\f3c2";
        }
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="bg-white min-h-screen">
<div class="w-full max-w-sm mx-auto min-h-screen flex flex-col">
    <div class="flex-1 flex flex-col justify-center items-center px-8 pt-7 pb-2">
        <div class="text-center mb-7">
            <h1 class="font-['Pacifico'] text-3xl text-gray-800 mb-4">logo</h1>
            <p class="text-lg text-gray-600 font-medium">경제 데이터로 스마트한 결정을</p>
            <p class="text-sm text-gray-500 mt-2">실시간 경제 지표와 분석을 한눈에</p>
        </div>

        <div id="login-form" class="w-full space-y-6">
            <div class="space-y-4">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <div class="w-5 h-5 flex items-center justify-center">
                            <i class="ri-mail-line text-gray-400 text-lg"></i>
                        </div>
                    </div>
                    <input type="email"
                           name="username"
                           placeholder="이메일 주소를 입력하세요"
                           class="w-full pl-12 pr-4 py-4 bg-secondary border-none rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-20 transition-all">
                </div>

                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <div class="w-5 h-5 flex items-center justify-center">
                            <i class="ri-lock-line text-gray-400 text-lg"></i>
                        </div>
                    </div>
                    <input type="password"
                           name="password"
                           placeholder="비밀번호를 입력하세요"
                           class="w-full pl-12 pr-12 py-4 bg-secondary border-none rounded-lg text-sm focus:outline-none focus:ring-2 focus:ring-primary focus:ring-opacity-20 transition-all">
                    <div class="absolute inset-y-0 right-0 pr-4 flex items-center cursor-pointer" id="password-toggle-btn">
                        <div class="w-5 h-5 flex items-center justify-center">
                            <i class="ri-eye-line text-gray-400 text-lg hover:text-gray-600 transition-colors"></i>
                        </div>
                    </div>
                </div>
            </div>

            <div class="flex items-center justify-between text-sm">
                <label class="flex items-center cursor-pointer">
                    <div class="relative">
                        <input type="checkbox" name="remember-me" class="opacity-0 absolute inset-0 w-4 h-4" id="remember-me-checkbox">
                        <div class="w-4 h-4 bg-secondary rounded border-2 border-gray-300 flex items-center justify-center" id="checkbox-ui">
                            <i class="ri-check-line text-white text-xs opacity-0" id="checkbox-icon"></i>
                        </div>
                    </div>
                    <span class="ml-2 text-gray-600">로그인 상태 유지</span>
                </label>
                <a th:href="@{/forgot-password}" class="text-primary hover:text-blue-700 transition-colors cursor-pointer">비밀번호 찾기</a>
            </div>

            <button type="submit" class="w-full bg-primary text-white py-4 !rounded-button font-medium text-sm hover:bg-blue-700 transition-colors shadow-lg cursor-pointer" id="login-button" disabled>
                로그인
            </button>
        </div>

        <a th:href="@{/oauth2/authorization/google}" class="mt-4 w-full bg-white border border-gray-200 text-gray-700 py-4 !rounded-button font-medium text-sm hover:bg-gray-50 transition-colors shadow-sm cursor-pointer flex items-center justify-center">
            <div class="w-5 h-5 flex items-center justify-center mr-3">
                <i class="ri-google-fill text-lg"></i>
            </div>
            구글로 계속하기
        </a>
    </div>
    <div class="px-8 pb-8">
        <div class="text-center space-y-4">
            <div class="text-sm">
                <span class="text-gray-600">계정이 없으신가요? </span>
                <a th:href="@{/register}" class="text-primary hover:text-blue-700 font-medium transition-colors cursor-pointer">회원가입</a>
            </div>

            <div class="flex items-center justify-center space-x-4 text-xs text-gray-500">
                <a th:href="@{/terms}" class="hover:text-gray-700 transition-colors cursor-pointer">이용약관</a>
                <span>·</span>
                <a th:href="@{/privacy}" class="hover:text-gray-700 transition-colors cursor-pointer">개인정보처리방침</a>
                <span>·</span>
                <a th:href="@{/support}" class="hover:text-gray-700 transition-colors cursor-pointer">고객센터</a>
            </div>
        </div>
    </div>
</div>

<script th:inline="javascript">
    document.addEventListener('DOMContentLoaded', function() {
        const emailInput = document.querySelector('input[name="username"]');
        const passwordInput = document.querySelector('input[name="password"]');
        const loginButton = document.getElementById('login-button');

        function validateForm() {
            const isEmailValid = emailInput.value.includes('@');
            const isPasswordValid = passwordInput.value.length >= 6;
            loginButton.disabled = !(isEmailValid && isPasswordValid);
            loginButton.classList.toggle('opacity-50', loginButton.disabled);
        }

        emailInput.addEventListener('input', validateForm);
        passwordInput.addEventListener('input', validateForm);
        validateForm();

        loginButton.addEventListener('click', async () => {
            const username = emailInput.value;
            const password = passwordInput.value;

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({ username, password })
                });

                if (response.ok) {
                    const data = await response.json();
                    localStorage.setItem('access_token', data.token);
                } else {
                    const error = await response.json();
                    alert(error.message);
                }
            } catch (err) {
                alert('서버 오류가 발생하였습니다.');
                console.log(err);
            }
        })
    });

    document.addEventListener('DOMContentLoaded', function() {
        const passwordInput = document.querySelector('input[name="password"]');
        const toggleBtn = document.getElementById('password-toggle-btn');
        const eyeIcon = toggleBtn.querySelector('i');

        toggleBtn.addEventListener('click', function() {
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                eyeIcon.classList.remove('ri-eye-line');
                eyeIcon.classList.add('ri-eye-off-line');
            } else {
                passwordInput.type = 'password';
                eyeIcon.classList.remove('ri-eye-off-line');
                eyeIcon.classList.add('ri-eye-line');
            }
        });
    });

    document.addEventListener('DOMContentLoaded', function() {
        const checkbox = document.getElementById('remember-me-checkbox');
        const checkboxUi = document.getElementById('checkbox-ui');
        const checkIcon = document.getElementById('checkbox-icon');

        checkbox.addEventListener('change', function() {
            if (checkbox.checked) {
                checkboxUi.classList.remove('bg-secondary', 'border-gray-300');
                checkboxUi.classList.add('bg-primary', 'border-primary');
                checkIcon.classList.remove('opacity-0');
            } else {
                checkboxUi.classList.remove('bg-primary', 'border-primary');
                checkboxUi.classList.add('bg-secondary', 'border-gray-300');
                checkIcon.classList.add('opacity-0');
            }
        });
    });
</script>
</body>
</html>
