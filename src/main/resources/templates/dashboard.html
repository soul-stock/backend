<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>대시보드</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <div class="header">
        <h2>대시보드</h2>
        <button onclick="logout()" class="btn btn-danger">로그아웃</button>
    </div>

    <div id="message"></div>

    <div class="card">
        <h3>환영합니다!</h3>
        <p>사용자: <strong th:text="${email}">이메일</strong></p>
        <p>JWT 토큰으로 인증된 페이지입니다.</p>
    </div>

    <div class="card">
        <h4>보호된 콘텐츠</h4>
        <p>이 페이지는 로그인한 사용자만 접근할 수 있습니다.</p>
        <p>JWT 토큰이 유효한 동안 이 콘텐츠를 볼 수 있습니다.</p>
    </div>

    <p class="text-center links"><a th:href="@{/}">홈으로</a></p>
</div>

<script>
    function logout() {
        fetch('/api/auth/logout', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            }
        })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    document.getElementById('message').innerHTML = '<div class="message success">' + data.message + '</div>';
                    setTimeout(() => {
                        window.location.href = '/';
                    }, 1000);
                }
            })
            .catch(error => {
                console.error('Error:', error);
            });
    }
</script>
</body>
</html>
