<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <title>JWT 인증 시스템</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h1>JWT 인증 시스템</h1>
    <p class="text-center">Spring Boot + Thymeleaf + JWT 로그인 시스템</p>

    <div th:if="${isLoggedIn}" class="card user-info">
        <h3>환영합니다!</h3>
        <p>로그인된 사용자: <strong th:text="${userEmail}">사용자</strong></p>
        <a th:href="@{/dashboard}" class="btn btn-primary">대시보드로 이동</a>
    </div>

    <div th:unless="${isLoggedIn}" class="btn-group">
        <a th:href="@{/login}" class="btn btn-primary">로그인</a>
        <a th:href="@{/register}" class="btn btn-success">회원가입</a>
        <a th:href="@{/dashboard}" class="btn">대시보드</a>
    </div>
</div>
</body>
</html>
