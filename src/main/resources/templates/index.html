<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>JWT 인증 시스템</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 50px; }
        .container { max-width: 400px; margin: 0 auto; text-align: center; }
        .btn { padding: 10px 20px; margin: 10px; background: #007bff; color: white; text-decoration: none; border-radius: 5px; }
        .btn:hover { background: #0056b3; }
    </style>
</head>
<body>
<div class="container">
    <h1>JWT 인증 시스템</h1>
    <p>Spring Boot + Thymeleaf + JWT 로그인 시스템</p>

    <!--  로그인 상태에 따른 조건부 렌더링  -->
    <div th:if="${isLoggedIn}" class="user-info">
        <h3>환영합니다!</h3>
        <p>로그인된 사용자: <strong th:text="${userEmail}">사용자</strong></p>
        <a th:href="@{/dashboard}" class="btn primary">대시보드로 이동</a>
    </div>

    <div th:unless="${isLoggedIn}">
        <a th:href="@{/login}" class="btn primary">로그인</a>
        <a th:href="@{/register}" class="btn">회원가입</a>
        <a th:href="@{/dashboard}" class="btn">대시보드</a>
    </div>
</div>
</body>
</html>
