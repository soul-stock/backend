<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원가입</title>
    <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
<div class="container">
    <h2>회원가입</h2>
    <div id="message"></div>
    <form id="registerForm" th:action="@{/api/auth/register}" method="post">
        <div class="form-group">
            <label for="email">이메일:</label>
            <input type="email" id="email" name="email" required>
        </div>
        <div class="form-group">
            <label for="password">비밀번호:</label>
            <input type="password" id="password" name="password" required>
        </div>
        <div class="form-group">
            <label for="username">사용자명:</label>
            <input type="text" id="username" name="username" required>
        </div>
        <div class="form-group">
            <label for="nickname">닉네임:</label>
            <input type="text" id="nickname" name="nickname" required>
        </div>
        <button type="submit" class="btn btn-success">회원가입</button>
    </form>
    <p class="text-center links">
        <a th:href="@{/login}">로그인</a> |
        <a th:href="@{/}">홈으로</a>
    </p>
</div>

<script>
    document.getElementById('registerForm').addEventListener('submit', function(e) {
        e.preventDefault();

        const email = document.getElementById('email')['value'];
        const password = document.getElementById('password')['value'];
        const username = document.getElementById('username')['value'];
        const nickname = document.getElementById('nickname')['value'];

        fetch('/api/auth/register', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
            },
            body: JSON.stringify({
                email: email,
                password: password,
                username: username,
                nickname: nickname
            })
        })
            .then(response => response.json())
            .then(data => {
                const messageDiv = document.getElementById('message');
                if (data.success) {
                    messageDiv.innerHTML = '<div class="message success">' + data.message + '</div>';
                    setTimeout(() => {
                        window.location.href = '/login';
                    }, 1500);
                } else {
                    messageDiv.innerHTML = '<div class="message error">' + (data.message || '회원가입 실패') + '</div>';
                }
            })
            .catch(error => {
                console.error('Error:', error);
                document.getElementById('message').innerHTML = '<div class="message error">회원가입 중 오류가 발생했습니다.</div>';
            });
    });
</script>
</body>
</html>
