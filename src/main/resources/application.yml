spring:
  application:
    name: spring

  # Database
  datasource:
    url: ${DATABASE_URL}
    username: ${DATABASE_USERNAME}
    password: ${DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 4

  # JPA
  jpa:
    database: postgresql
    hibernate:
      ddl-auto: create

  # JWT
  jwt:
    secret: mySecretKey
    expiration: 86400000

  # JSP
  mvc:
    view:
      prefix: /WEB-INF/views/
      suffix: .jsp